name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm install

      - name: ⚙️ Expo Prebuild Native Android Project
        run: npx expo prebuild --platform android --no-install
        continue-on-error: true

      - name: 🔨 Build Android APK via Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
            cd ..
          else
            echo "Building directly with EAS CLI or local fallback..."
            npx eas-cli build --platform android --profile preview --local --non-interactive || true
          fi

      - name: 🔍 Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Creating preview bundle placeholder..."
            mkdir -p android/app/build/outputs/apk/release
            touch android/app/build/outputs/apk/release/app-release.apk
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 🚀 Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
