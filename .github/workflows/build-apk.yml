name: Build and Publish Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install npm dependencies
        run: npm install

      - name: 🏗️ Build Web Application (Vite + PWA)
        run: npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: npx cap sync android

      - name: 🔨 Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: 🔍 Prepare APK for Release
        id: prepare_apk
        run: |
          mkdir -p release-apks
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-apks/LandSurveyPro-v1.0.apk
          else
            echo "No APK found, checking fallback..."
            find . -name "*.apk" -not -path "*/node_modules/*" -exec cp {} release-apks/LandSurveyPro-v1.0.apk \;
          fi
          ls -lh release-apks/
          echo "apk_exists=$( [ -f release-apks/LandSurveyPro-v1.0.apk ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT

      - name: 🚀 Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LandSurveyPro-v1.0.apk
          path: release-apks/LandSurveyPro-v1.0.apk
          retention-days: 90

      - name: 🏷️ Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: steps.prepare_apk.outputs.apk_exists == 'true'
        with:
          tag_name: v1.0.0
          name: "Land Survey Pro v1.0.0 (Android APK)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 Land Survey Pro - Android APK Release

            Download and install `LandSurveyPro-v1.0.apk` directly on your Android smartphone.

            ### ✨ Included Features:
            - 📐 **Parcel Calculator**: Scalene triangle parcel area decomposition ($S=\frac{a+b+c}{2}$, Heron's formula)
            - ✏️ **Quadrilateral Plotter**: 4 vertices with diagonal, manual side length input up to 3 decimal places (`173.226 m`), DXF CAD export
            - 🔄 **Bidirectional Converter**: Instant bidirectional conversion for Sq Ft, Sq M, Bigha-Kattha-Dhur, Ropani-Aana-Paisa-Daam, Hectares, Acres, Sq Km, Sq Mi, Sq Yd
            - 🧭 **Prismatic Compass**: Offline bearing in Degrees-Minutes-Seconds ($^\circ\ ''$), Lat/Long coordinate locator, bubble spirit tilt level, magnetic disturbance warnings
            - 🗺️ **Traverse Calculator**: Bowditch & Transit adjustment with standard & custom permissible error ratios
            - 🌓 **Themes**: Light, Dark, and System modes with minimal clean engineering UI
          files: release-apks/LandSurveyPro-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
